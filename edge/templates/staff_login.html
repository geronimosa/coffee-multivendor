<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ vendor.name }} staff · QRKiosk Edge</title><link rel="stylesheet" href="{{ url_for('static',filename='edge.css') }}"></head>
<body style="--brand:{{ vendor.theme_primary }};--accent:{{ vendor.theme_accent }};--page:{{ vendor.theme_background }};--surface:{{ vendor.theme_surface }};--text:{{ vendor.theme_text }}"><main class="staff-login-shell"><section class="staff-card"><span class="edge-badge dark">QRKiosk Edge · Local staff</span><h1>{{ vendor.name }} staff</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
{% if access_ready %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="access_code">Staff key</label><input id="access_code" type="password" name="access_code" autocomplete="current-password" required autofocus><button class="primary-button continue" type="submit"><span>Open fulfilment queue</span><span>→</span></button></form>{% else %}<div class="error">Staff access has not been configured. Create a user key from the central super-admin Edge page and allow the Pi to synchronize.</div>{% endif %}
<p><a href="/shop/{{ vendor.slug }}">Open customer shop</a></p></section></main></body></html>
