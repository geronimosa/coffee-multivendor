<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout · {{ vendor.name }}</title><link rel="stylesheet" href="{{ url_for('static',filename='edge.css') }}"></head>
<body style="--brand:{{ vendor.theme_primary }};--accent:{{ vendor.theme_accent }};--page:{{ vendor.theme_background }};--surface:{{ vendor.theme_surface }};--text:{{ vendor.theme_text }}"><main class="checkout-shell"><div class="checkout-head"><a href="/cart.php">← Cart</a><div><span class="edge-badge dark">QRKiosk Edge</span><h1>Checkout</h1></div></div>
<section class="panel"><h2>Order summary</h2>{% for item in items %}<div class="summary-row"><span>{{ item.quantity }} × {{ item.name }} · {{ item.variant }}</span><strong>R{{ '%.2f'|format(item.subtotal|float) }}</strong></div>{% endfor %}<div class="total"><span>Total</span><strong>R{{ '%.2f'|format(total|float) }}</strong></div></section>
<section class="panel"><h2>Your details</h2><form method="post" action="/confirm_order.php"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="name">Name</label><input id="name" name="name" maxlength="120" required><label for="phone">Mobile number</label><input id="phone" name="phone" maxlength="32" inputmode="tel" required><div class="payment-choice"><strong>Manual payment</strong><span>Pay at the counter. Staff will confirm payment.</span></div><button class="primary-button continue" type="submit"><span>Place order</span><span>→</span></button></form></section></main></body></html>
